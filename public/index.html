<!doctype html>
<!--
  ropa30 — index.html
  SPDX-License-Identifier: AGPL-3.0-or-later
  Strict CSP; Alpine.js CSP build (property/method names only).
  Icons: inline SVG <symbol> sprite + static <use> (no emoji, no network).
-->
<html lang="it" x-data="ropa30App" x-bind:lang="lang">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title x-text="appTitle">ropa30 — Il registro dei trattamenti GDPR, semplice.</title>
    <meta name="description"
          x-bind:content="appDescription"
          content="Il registro delle attività di trattamento ex art. 30 GDPR, semplice e gratuito. Applicazione web locale: i tuoi dati non lasciano mai il tuo dispositivo." />
    <meta name="author" content="Nicola Fabiano" />
    <meta name="license" content="AGPL-3.0-or-later" />
    <!-- Canonical + SEO -->
    <link rel="canonical" href="https://ropa30.eu/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (static EN; social scrapers don't run JS) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ropa30" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://ropa30.eu/" />
    <meta property="og:title" content="ropa30 — The GDPR Article 30 register, simplified." />
    <meta property="og:description" content="A free, local-first, open-source web app to keep your GDPR Article 30 Record of Processing Activities. Your data never leaves your browser." />
    <meta property="og:image" content="https://ropa30.eu/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ropa30 — The GDPR Article 30 register, simplified." />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ropa30 — The GDPR Article 30 register, simplified." />
    <meta name="twitter:description" content="A free, local-first, open-source web app to keep your GDPR Article 30 Record of Processing Activities. Your data never leaves your browser." />
    <meta name="twitter:image" content="https://ropa30.eu/og-image.jpg" />
    <meta name="twitter:image:alt" content="ropa30 — The GDPR Article 30 register, simplified." />
    <!-- Structured data (JSON-LD): describes ropa30 to search engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "ropa30",
      "url": "https://ropa30.eu/",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web browser",
      "description": "A free, local-first, open-source web app to keep your GDPR Article 30 Record of Processing Activities. Your data never leaves your browser.",
      "inLanguage": ["en", "it"],
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "EUR"
      },
      "license": "https://www.gnu.org/licenses/agpl-3.0.html",
      "author": {
        "@type": "Person",
        "name": "Nicola Fabiano",
        "url": "https://nicfab.eu"
      }
    }
    </script>

    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self';
      style-src 'self';
      img-src 'self' data:;
      connect-src 'self';
      font-src 'self';
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    " />

    <meta name="theme-color" content="#1a4d6e" />
    <link rel="stylesheet" href="css/ropa30.css" />
    <link rel="icon" type="image/png" href="icons/favicon.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />

    <script src="js/lib/dexie.min.js" defer></script>
    <script src="js/lib/xlsx.full.min.js" defer></script>
    <script src="js/lib/fflate.min.js" defer></script>
    <script src="js/app.js" type="module"></script>
    <script src="js/lib/alpine.min.js" defer></script>
  </head>

  <body class="min-h-dvh flex flex-col">

    <!-- ===================== SVG ICON SPRITE =====================
         Defined once, referenced via <svg><use href="#icon-…"> (static).
         Monochrome, inherit color via currentColor. No emoji, no network. -->
    <svg width="0" height="0" class="hidden" aria-hidden="true" focusable="false">
      <symbol id="icon-doc" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2.75h7.5L19 8.25V20a1.25 1.25 0 0 1-1.25 1.25H6A1.25 1.25 0 0 1 4.75 20V4A1.25 1.25 0 0 1 6 2.75Z" />
        <path d="M13.25 3v5.25H18.5" />
        <path d="M8 12.5h8M8 15.5h8M8 18h5" />
      </symbol>
      <symbol id="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="6.25" />
        <path d="m20 20-3.5-3.5" />
      </symbol>
      <symbol id="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 6l12 12M18 6 6 18" />
      </symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M5 12h14" />
      </symbol>
      <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6L9 17l-5-5" />
      </symbol>
      <symbol id="icon-info" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 11v5" />
        <path d="M12 8h.01" />
      </symbol>
      <symbol id="icon-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 7h14" />
        <path d="M10 7V5.5A1.5 1.5 0 0 1 11.5 4h1A1.5 1.5 0 0 1 14 5.5V7" />
        <path d="M6.5 7l.7 11a1.5 1.5 0 0 0 1.5 1.4h6.6a1.5 1.5 0 0 0 1.5-1.4l.7-11" />
        <path d="M10 11v5M14 11v5" />
      </symbol>
      <symbol id="icon-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.75 19.25 9 18l9.5-9.5a1.77 1.77 0 0 0-2.5-2.5L6.5 15.5l-1.75 3.75Z" />
        <path d="m14.5 7.5 2.5 2.5" />
      </symbol>
      <symbol id="icon-arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7" />
      </symbol>
      <symbol id="icon-download" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12m0 0 4-4m-4 4-4-4" />
        <path d="M5 20.25h14" />
      </symbol>
      <symbol id="icon-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 16V4m0 0L7 9m5-5 5 5" />
        <path d="M4 20h16" />
      </symbol>
      <symbol id="icon-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="m6 9 6 6 6-6" />
      </symbol>
      <symbol id="icon-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="m9 6 6 6-6 6" />
      </symbol>
    </svg>

    <a href="#main"
       class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50
              focus:bg-brand-700 focus:text-white focus:px-3 focus:py-2 focus:rounded"
       x-text="skipToContent">Vai al contenuto principale</a>

    <!-- Header -->
    <header class="border-b border-brand-200 bg-white">
      <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between gap-4">
        <div class="flex items-baseline gap-3">
          <span class="text-2xl font-bold text-brand-700 tracking-tight">ropa30</span>
          <span class="hidden sm:inline text-sm text-brand-600" x-text="brandTagline">
            Il registro dei trattamenti GDPR, semplice.
          </span>
        </div>
        <div class="flex items-center gap-2">
          <label for="lang-switcher" class="text-sm text-brand-700 sr-only sm:not-sr-only"
                 x-text="langSwitcherLabel">Lingua</label>
          <select id="lang-switcher"
                  class="text-sm border border-brand-300 rounded px-2 py-1 bg-white text-brand-900"
                  x-on:change="setLang">
            <option value="it" x-bind:selected="isItalianSelected">Italiano</option>
            <option value="en" x-bind:selected="isEnglishSelected">English</option>
          </select>
        </div>
      </div>
    </header>

    <!-- Main -->
    <main id="main" class="flex-1">
      <div x-bind:class="wrapperClass">
        <!-- Global restore file input (reachable from any view: welcome, list). -->
        <input type="file" id="restore-file-input" accept="application/json" class="hidden" x-on:change="fileSelezionato">
        <!-- Delete-activity confirmation dialog. -->
        <template x-if="isEliminaConfirmOpen">
          <div class="fixed inset-0 z-50 flex items-center justify-center bg-brand-950/60 p-4"
               x-on:keydown.escape.window="annullaElimina"
               x-on:click.self="annullaElimina">
            <div class="w-full max-w-md rounded-2xl bg-white shadow-xl p-5"
                 role="dialog" aria-modal="true" aria-labelledby="elimina-conf-title">
              <h2 id="elimina-conf-title" class="text-lg font-bold text-brand-900" x-text="L.eliminaConfermaTitolo">Eliminare questo trattamento?</h2>
              <p class="mt-2 text-sm text-brand-700" x-text="L.eliminaConfermaTesto"></p>
              <p class="mt-2 text-sm text-brand-800 bg-warning-500/10 border-l-4 border-warning-500 rounded-r-lg p-2" x-text="L.eliminaConfermaNota"></p>
              <div class="mt-5 flex flex-wrap justify-end gap-2">
                <button type="button" x-on:click="annullaElimina"
                        class="inline-flex items-center gap-2 text-sm rounded-lg border border-brand-300 px-3 py-2 text-brand-700 hover:bg-brand-50"
                        x-text="L.eliminaAnnulla">Annulla</button>
                <button type="button" x-on:click="confermaElimina" x-bind:disabled="eliminaInCorso"
                        class="inline-flex items-center gap-2 text-sm rounded-lg bg-danger-600 px-3 py-2 text-white font-medium hover:bg-danger-700 disabled:opacity-50 disabled:cursor-not-allowed"
                        x-text="L.eliminaConferma">Elimina definitivamente</button>
              </div>
            </div>
          </div>
        </template>
        <!-- Dialog RESET TOTALE (svuota tutti i dati) -->
        <template x-if="isResetConfirmOpen">
          <div class="fixed inset-0 z-50 flex items-center justify-center bg-brand-950/60 p-4"
               x-on:keydown.escape.window="chiudiResetConfirm"
               x-on:click.self="chiudiResetConfirm">
            <div class="w-full max-w-md rounded-2xl bg-white shadow-xl p-5"
                 role="dialog" aria-modal="true" aria-labelledby="reset-conf-title">
              <h2 id="reset-conf-title" class="text-lg font-bold text-danger-700" x-text="L.resetConfermaTitolo">Svuotare tutti i dati?</h2>
              <p class="mt-2 text-sm text-brand-700" x-text="L.resetConfermaTesto"></p>
              <p class="mt-2 text-sm text-brand-800 bg-warning-500/10 border-l-4 border-warning-500 rounded-r-lg p-2" x-text="L.resetConfermaNota"></p>
              <div class="mt-5 flex flex-wrap justify-end gap-2">
                <button type="button" x-on:click="resetScaricaBackup"
                        class="inline-flex items-center gap-2 text-sm rounded-lg border border-brand-300 px-3 py-2 text-brand-700 hover:bg-brand-50"
                        x-text="L.resetScaricaBackup">Scarica backup</button>
                <button type="button" x-on:click="chiudiResetConfirm"
                        class="inline-flex items-center gap-2 text-sm rounded-lg border border-brand-300 px-3 py-2 text-brand-700 hover:bg-brand-50"
                        x-text="L.resetAnnulla">Annulla</button>
                <button type="button" x-on:click="confermaReset" x-bind:disabled="resetInCorso"
                        class="inline-flex items-center gap-2 text-sm rounded-lg bg-danger-600 px-3 py-2 text-white font-medium hover:bg-danger-700 disabled:opacity-50 disabled:cursor-not-allowed"
                        x-text="L.resetConferma">Svuota tutti i dati</button>
              </div>
            </div>
          </div>
        </template>

        <!-- Global restore confirmation dialog (reachable from any view). -->
        <template x-if="isRestoreConfirmOpen">
          <div class="fixed inset-0 z-50 flex items-center justify-center bg-brand-950/60 p-4"
               x-on:keydown.escape.window="annullaRestore"
               x-on:click.self="annullaRestore">
            <div class="w-full max-w-md rounded-2xl bg-white shadow-xl p-5"
                 role="dialog" aria-modal="true" aria-labelledby="restore-conf-title">
              <h2 id="restore-conf-title" class="text-lg font-bold text-brand-900" x-text="L.restoreTitoloConferma">Confermi il ripristino?</h2>
              <p class="mt-2 text-sm text-brand-700" x-text="L.restoreTestoConferma"></p>
              <p x-show="restoreFaraBackup"
                 class="mt-2 text-sm text-brand-800 bg-warning-500/10 border-l-4 border-warning-500 rounded-r-lg p-2"
                 x-text="L.restoreDisclaimerBackup"></p>
              <dl class="mt-4 rounded-lg bg-brand-50 p-3 text-sm">
                <div class="flex justify-between gap-4">
                  <dt class="text-brand-600" x-text="L.restoreRiepilogoTrattamenti">Trattamenti nel file:</dt>
                  <dd class="font-semibold text-brand-900" x-text="restoreCountPA"></dd>
                </div>
                <div class="mt-1 flex justify-between gap-4">
                  <dt class="text-brand-600" x-text="L.restoreRiepilogoData">Backup creato il:</dt>
                  <dd class="text-brand-900" x-text="restoreDataExport"></dd>
                </div>
              </dl>
              <div class="mt-5 flex flex-wrap justify-end gap-2">
                <button type="button" x-on:click="annullaRestore"
                        class="inline-flex items-center gap-2 text-sm rounded-lg border border-brand-300 px-3 py-2 text-brand-700 hover:bg-brand-50"
                        x-text="L.restoreAnnulla">Annulla</button>
                <button type="button" x-on:click="confermaRestore" x-bind:disabled="restoreInCorso"
                        class="inline-flex items-center gap-2 text-sm rounded-lg bg-danger-600 px-3 py-2 text-white font-medium hover:bg-danger-700 disabled:opacity-50 disabled:cursor-not-allowed"
                        x-text="L.restoreConferma">Ripristina (sostituisci tutto)</button>
              </div>
            </div>
          </div>
        </template>


        <!-- ===================== ONBOARDING ===================== -->
        <!-- ===================== WELCOME (prima configurazione) ===================== -->
        <template x-if="isViewWelcome">
          <section aria-labelledby="welcome-title" class="max-w-2xl mx-auto">
            <p class="text-2xl font-bold text-brand-700 tracking-tight">ropa30</p>
            <h1 id="welcome-title" class="mt-2 text-3xl sm:text-4xl font-bold text-brand-900 tracking-tight"
                x-text="L.welcomeTitolo">Registro delle attività di trattamento</h1>
            <p class="mt-4 text-brand-700 leading-relaxed" x-text="L.welcomeIntro"></p>

            <ul class="mt-6 space-y-2">
              <li class="flex items-start gap-2 text-brand-800">
                <svg class="w-5 h-5 mt-0.5 shrink-0 text-accent-600" aria-hidden="true"><use href="#icon-check" /></svg>
                <span x-text="L.welcomePunto1"></span>
              </li>
              <li class="flex items-start gap-2 text-brand-800">
                <svg class="w-5 h-5 mt-0.5 shrink-0 text-accent-600" aria-hidden="true"><use href="#icon-check" /></svg>
                <span x-text="L.welcomePunto2"></span>
              </li>
              <li class="flex items-start gap-2 text-brand-800">
                <svg class="w-5 h-5 mt-0.5 shrink-0 text-accent-600" aria-hidden="true"><use href="#icon-check" /></svg>
                <span x-text="L.welcomePunto3"></span>
              </li>
              <li class="flex items-start gap-2 text-brand-800">
                <svg class="w-5 h-5 mt-0.5 shrink-0 text-accent-600" aria-hidden="true"><use href="#icon-check" /></svg>
                <span x-text="L.welcomePunto4"></span>
              </li>
            </ul>

            <div class="mt-8 flex items-start gap-3 rounded-xl border border-brand-200 bg-brand-50 p-4">
              <svg class="w-5 h-5 mt-0.5 shrink-0 text-brand-500" aria-hidden="true"><use href="#icon-info" /></svg>
              <p class="text-sm text-brand-700 leading-relaxed" x-text="L.welcomeNotaStorage"></p>
            </div>
            <h2 class="mt-10 text-lg font-semibold text-brand-800" x-text="L.welcomeComeIniziare">Come vuoi iniziare?</h2>
            <div class="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-4">
              <button type="button" x-on:click="welcomeImportaBackup"
                      class="text-left rounded-2xl border border-brand-300 bg-white p-5 hover:border-brand-500 hover:bg-brand-50 transition">
                <span class="flex items-center gap-2 font-semibold text-brand-900">
                  <svg class="w-5 h-5 shrink-0 text-brand-500" aria-hidden="true"><use href="#icon-upload" /></svg>
                  <span x-text="L.welcomeImportTitolo">Ho già un backup</span>
                </span>
                <span class="mt-1 block text-sm text-brand-600" x-text="L.welcomeImportTesto"></span>
              </button>
              <button type="button" x-on:click="welcomeIniziaDaZero"
                      class="text-left rounded-2xl border border-brand-300 bg-white p-5 hover:border-brand-500 hover:bg-brand-50 transition">
                <span class="flex items-center gap-2 font-semibold text-brand-900">
                  <svg class="w-5 h-5 shrink-0 text-brand-500" aria-hidden="true"><use href="#icon-plus" /></svg>
                  <span x-text="L.welcomeNuovoTitolo">Inizia da zero</span>
                </span>
                <span class="mt-1 block text-sm text-brand-600" x-text="L.welcomeNuovoTesto"></span>
              </button>
            </div>

            <p class="mt-6 text-sm text-brand-600" x-text="L.welcomeNota"></p>
          </section>
        </template>

        <template x-if="isViewOnboarding">
          <section aria-labelledby="onb-title"
                   x-on:input="segnaTitolareDirty" x-on:change="segnaTitolareDirty">
            <h1 id="onb-title" class="text-3xl sm:text-4xl font-bold text-brand-900 tracking-tight"
                x-text="L.onbTitolo">Configura il registro</h1>
            <p class="mt-3 text-brand-700 leading-relaxed" x-text="L.onbSottotitolo"></p>

            <fieldset class="mt-8 border-0 p-0 m-0">
              <legend class="text-lg font-semibold text-brand-800 mb-4" x-text="L.onbSezioneTitolare"></legend>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="sm:col-span-2">
                  <label for="f-denominazione" class="block text-sm font-medium text-brand-800 mb-1" x-text="L.lblDenominazione"></label>
                  <input id="f-denominazione" type="text" x-model="denominazione" maxlength="150"
                         class="w-full rounded border border-brand-300 bg-white px-3 py-2 text-brand-900" />
                </div>
                <div>
                  <label for="f-forma" class="block text-sm font-medium text-brand-800 mb-1" x-text="L.lblFormaGiuridica"></label>
                  <input id="f-forma" type="text" x-model="formaGiuridica"
                         class="w-full rounded border border-brand-300 bg-white px-3 py-2 text-brand-900" />
                </div>
                <div>
                  <label for="f-cf" class="block text-sm font-medium text-brand-800 mb-1" x-text="L.lblCodiceFiscale"></label>
                  <input id="f-cf" type="text" x-model="codiceFiscale"
                         class="w-full rounded border border-brand-300 bg-white px-3 py-2 text-brand-900" />
                </div>
                <div>
                  <label for="f-piva" class="block text-sm font-medium text-brand-800 mb-1" x-text="L.lblPartitaIVA"></label>
                  <input id="f-piva" type="text" x-model="partitaIVA"
                         class="w-full rounded border border-brand-300 bg-white px-3 py-2 text-brand-900" />
                </div>
                <div>
                  <label for="f-tel" class="block text-sm font-medium text-brand-800 mb-1" x-text="L.lblTelefono"></label>
                  <input id="f-tel" type="tel" x-model="telefono"
                         class="w-full rounded border border-brand-300 bg-white px-3 py-2 text-brand-900" />
                </div>
              </div>
            </fieldset>

            <fieldset class="mt-6 border-0 p-0 m-0">
              <legend class="text-lg font-semibold text-brand-800 mb-4" x-text="L.onbSezioneIndirizzo"></legend>
              <div class="grid grid-cols-1 sm:grid-cols-6 gap-4">
                <div class="sm:col-span-4">
                  <label for="f-via" class="block text-sm font-medium text-brand-800 mb-1" x-text="L.lblVia"></label>
                  <input id="f-via" type="text" x-model="via"
                         class="w-full rounded border border-brand-300 bg-white px-3 py-2 text-brand-900" />
                </div>
                <div class="sm:col-span-2">
                  <label for="f-civico" class="block text-sm font-medium text-brand-800 mb-1" x-text="L.lblCivico"></label>
                  <input id="f-civico" type="text" x-model="civico"
                         class="w-full rounded border border-brand-300 bg-white px-3 py-2 text-brand-900" />
                </div>
                <div class="sm:col-span-2">
                  <label for="f-cap" class="block text-sm font-medium text-brand-800 mb-1" x-text="L.lblCap"></label>
                  <input id="f-cap" type="text" x-model="cap"
                         class="w-full rounded border border-brand-300 bg-white px-3 py-2 text-brand-900" />
                </div>
                <div class="sm:col-span-4">
                  <label for="f-citta" class="block text-sm font-medium text-brand-800 mb-1" x-text="L.lblCitta"></label>
                  <input id="f-citta" type="text" x-model="citta"
                         class="w-full rounded border border-brand-300 bg-white px-3 py-2 text-brand-900" />
                </div>
                <div class="sm:col-span-3">
                  <label for="f-prov" class="block text-sm font-medium text-brand-800 mb-1" x-text="L.lblProvincia"></label>
                  <input id="f-prov" type="text" x-model="provincia"
                         class="w-full rounded border border-brand-300 bg-white px-3 py-2 text-brand-900" />

                  <label for="f-sito" class="block text-sm font-medium text-brand-800 mb-1" x-text="L.lblSitoWeb"></label>

            <fieldset class="mt-6 border-0 p-0 m-0">

                <button type="button" role="tab" x-on:click="cambiaRegistro('responsabile')"

              </div>
              <div class="flex items-center gap-2">
                <button type="button" x-on:click="apriCatalogo"
                        class="inline-flex items-center gap-2 text-sm rounded-lg border border-brand-300 px-3 py-1.5 text-brand-700 hover:bg-white">
                  <svg class="w-4 h-4" aria-hidden="true"><use href="#icon-plus" /></svg>
                  <span x-text="L.btnAggiungiTrattamento">Aggiungi trattamento</span>
                </button>

                  <span x-text="L.btnAzioni">Azioni</span>
                </button>

            <template x-if="haTrattamenti">

                    <span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-brand-400">
                      <svg class="w-4 h-4" aria-hidden="true"><use href="#icon-search" /></svg>
                    </span>
                    <input type="search" x-model="queryRicerca"

                          x-text="L.btnPulisci">Pulisci</button>

                          x-model="filtroUnita"

                          class="shrink-0 text-sm rounded-lg border border-brand-300 bg-white px-3 py-2.5 text-brand-700">

              </div>

            <!-- Lista risultati -->
            <template x-if="haRisultati">
              <ul class="mt-4 space-y-3">
                <template x-for="tr in trattamentiFiltrati" x-bind:key="tr.id">

                    <article class="group rounded-xl border border-brand-200 bg-white p-4 sm:p-5 shadow-sm

                             role="button"
                             tabindex="0"
                             x-bind:data-id="tr.id"

                          </div>
                          <dl class="mt-2 space-y-1 text-sm">
                            <div class="flex gap-2">
                              <dt class="shrink-0 font-medium text-brand-500" x-text="L.listaFinalita"></dt>
                              <dd class="text-brand-800" x-text="tr.finalitaSintesi"></dd>

                            <div class="flex gap-2">
                              <dt class="shrink-0 font-medium text-brand-500" x-text="L.listaBaseGiuridica"></dt>
                              <dd class="text-brand-800" x-text="tr.basiSintesi"></dd>
                            </div>
                          </dl>
                        </div>
                      </div>

                    <span x-text="L.btnAggiungiTrattamento">Aggiungi trattamento</span>

                      <p class="mt-1 text-sm text-brand-600" x-text="L.catalogoSottotitolo"></p>
                    </div>
                    <button type="button" x-on:click="chiudiCatalogo" x-bind:aria-label="L.btnChiudi"
                            class="shrink-0 rounded-lg p-1.5 text-brand-500 hover:bg-brand-100 hover:text-brand-800">
                      <svg class="w-5 h-5" aria-hidden="true"><use href="#icon-close" /></svg>
                    </button>
                  </div>

                  <!-- Ricerca nel catalogo -->
                  <div class="border-b border-brand-100 p-4 sm:px-5">
                    <div class="relative">
                      <span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-brand-400">
                        <svg class="w-4 h-4" aria-hidden="true"><use href="#icon-search" /></svg>

                          <svg class="w-5 h-5" aria-hidden="true"><use href="#icon-doc" /></svg>
                        </span>
                        <div class="min-w-0 flex-1">
                          <div class="flex flex-wrap items-center gap-2">
                            <h3 class="font-semibold text-brand-900" x-text="tpl.nomeLoc"></h3>
                            <span class="shrink-0 rounded-full bg-brand-100 px-2 py-0.5 text-xs font-medium text-brand-700"

                      <li class="px-5 py-8 text-center text-sm text-brand-600" x-text="L.catalogoNessunRisultato"></li>

                    <p class="text-xs text-brand-500" x-text="L.catalogoDisclaimer"></p>

                <div class="fixed inset-0 z-50 flex items-center justify-center bg-brand-950/60 p-4"

                  <div class="w-full max-w-md rounded-2xl bg-white shadow-xl p-5"
                       role="dialog" aria-modal="true" aria-labelledby="azioni-title">

                        <span class="font-semibold text-danger-700" x-text="L.azioniReset">Svuota tutti i dati</span>

                      <button type="button" x-on:click="chiudiAzioniMenu"

                                              <label class="block text-xs text-brand-400 mb-0.5" x-text="L.editorColonnaEn"></label>
                                              <template x-if="sc.multilinea">
                                                <textarea rows="2" x-model="sc.valEn" x-on:input="segnaDirty"
                                                          class="w-full rounded border border-brand-300 bg-white px-3 py-2 text-brand-900"></textarea>
                                              </template>
                                              <template x-if="!sc.multilinea">
                                                <input type="text" x-model="sc.valEn" x-on:input="segnaDirty"
                                                       class="w-full rounded border border-brand-300 bg-white px-3 py-2 text-brand-900" />
                                              </template>
                                            </div>
                                          </div>
                                        </template>

                                        <template x-if="sc.isBool">
                                          <label class="inline-flex items-center gap-2 text-sm text-brand-800">
                                            <input type="checkbox" x-model="sc.val" x-on:change="segnaDirty"
                                                   class="h-4 w-4 accent-brand-700" />
                                            <span x-text="sc.label"></span>
                                          </label>
                                        </template>

                                        <template x-if="sc.isEnum1">
                                          <select x-model="sc.val" x-on:change="segnaDirty"
                                                  class="w-full rounded border border-brand-300 bg-white px-3 py-2 text-brand-900">
                                            <template x-for="opz in sc.opzioni" x-bind:key="opz.code">
                                              <option x-bind:value="opz.code" x-text="opz.label"></option>
                                            </template>
                                          </select>
                                        </template>
                                      </div>
                                    </template>
                                  </div>
                                </div>
                              </template>
                            </div>
                            <button type="button"
                                    x-bind:data-sez="si" x-bind:data-campo="ci"
                                    x-on:click="aggiungiRiga"
                                    class="mt-2 inline-flex items-center gap-2 text-sm rounded-lg border border-brand-300 px-3 py-1.5 text-brand-700 hover:bg-white">
                              <svg class="w-4 h-4" aria-hidden="true"><use href="#icon-plus" /></svg>
                              <span x-text="L.editorAggiungiElemento">Aggiungi elemento</span>
                            </button>
                          </div>
                        </template>

                      </div>
                    </template>
                  </div>
                </section>
              </template>
            </div>
          <!-- Barra azioni (fondo) -->
            <div class="mt-10 border-t border-brand-200 pt-6 flex flex-wrap items-center gap-2">
              <button type="button" x-on:click="salvaTrattamento" x-bind:disabled="editSalvaDisabilitato"
                      class="inline-flex items-center gap-2 rounded-lg bg-brand-700 px-4 py-2 text-white font-medium shadow-sm hover:bg-brand-800 disabled:opacity-50 disabled:cursor-not-allowed"
                      x-text="L.editorSalva">Salva</button>
              <button type="button" x-on:click="annullaEditor"
                      class="inline-flex items-center gap-2 text-sm rounded-lg border border-brand-300 px-3 py-2 text-brand-700 hover:bg-white"
                      x-text="L.editorAnnulla">Annulla</button>
            </div>

            <!-- Conferma inline: modifiche non salvate -->
            <template x-if="chiediConfermaAnnulla">
              <div class="fixed inset-0 z-50 flex items-center justify-center bg-brand-950/60 p-4"
                   x-on:keydown.escape.window="annullaAnnulla"
                   x-on:click.self="annullaAnnulla">
                <div class="w-full max-w-md rounded-2xl bg-white shadow-xl p-5"
                     role="dialog" aria-modal="true" aria-labelledby="conf-title">
                  <h2 id="conf-title" class="text-lg font-bold text-brand-900" x-text="L.editorConfermaTitolo">Modifiche non salvate</h2>
                  <p class="mt-2 text-sm text-brand-700" x-text="L.editorConfermaTesto"></p>
                  <div class="mt-5 flex flex-wrap justify-end gap-2">
                    <button type="button" x-on:click="annullaAnnulla"
                            class="inline-flex items-center gap-2 text-sm rounded-lg border border-brand-300 px-3 py-2 text-brand-700 hover:bg-brand-50"
                            x-text="L.editorConfermaResta">Continua a modificare</button>
                    <button type="button" x-on:click="confermaAnnulla"
                            class="inline-flex items-center gap-2 text-sm rounded-lg bg-danger-600 px-3 py-2 text-white font-medium hover:bg-danger-700"
                            x-text="L.editorConfermaEsci">Esci senza salvare</button>
                  </div>
                </div>
              </div>
            </template>

          </section>
        </template>
      </div>
    </main>

    <!-- ===================== PRINT AREA (Fase 4, solo stampa) ===================== -->
    <div id="print-area" aria-hidden="true">
      <header class="print-header">
        <h1 x-text="titoloRegistroExport">Registro delle attività di trattamento</h1>
        <template x-if="registroStampa.estratto.estratto">
          <p class="print-estratto"><span x-text="L.estrattoTitolo"></span> &mdash; <span x-text="L.estrattoUnita"></span>: <span x-text="registroStampa.estratto.unita"></span></p>
        </template>
        <table class="print-titolare">
          <template x-for="(r, ri) in registroStampa.titolareRighe" x-bind:key="ri">
            <tr>
              <td class="print-td-label" x-text="r.label"></td>
              <td class="print-td-value" x-text="r.value"></td>
            </tr>
          </template>
        </table>
        <p class="print-meta"><span x-text="L.printGeneratoIl"></span>: <span x-text="registroStampa.generatoIl"></span></p>
      </header>
      <template x-for="(tr, ti) in registroStampa.trattamenti" x-bind:key="ti">
        <section class="print-trattamento">
          <h2 x-text="tr.titolo"></h2>
          <template x-for="(sez, si) in tr.sezioni" x-bind:key="si">
            <div class="print-sezione">
              <h3 x-text="sez.titolo"></h3>
              <template x-for="(campo, ci) in sez.campi" x-bind:key="ci">
                <div class="print-campo">
                  <span class="print-label" x-text="campo.label"></span>
                  <template x-if="campo.isSemplice">
                    <span class="print-value" x-text="campo.value"></span>
                  </template>
                  <template x-if="campo.isLista">
                    <ul class="print-lista">
                      <template x-for="(el, ii) in campo.items" x-bind:key="ii">
                        <li x-text="el.value"></li>
                      </template>
                    </ul>
                  </template>
                  <template x-if="campo.isGruppi">
                    <div class="print-gruppi">
                      <template x-for="(g, gi) in campo.gruppi" x-bind:key="gi">
                        <div class="print-gruppo">
                          <template x-for="(c, cci) in g.campi" x-bind:key="cci">
                            <div><span class="print-label" x-text="c.label"></span> <span x-text="c.value"></span></div>
                          </template>
                        </div>
                      </template>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </template>
        </section>
      </template>
    </div>

    <!-- Footer -->
    <footer class="border-t border-brand-200 bg-white">
      <div class="max-w-5xl mx-auto px-4 py-6 text-sm text-brand-700
                  flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <div class="flex items-center gap-2">
          <a href="https://nicfab.eu" rel="noopener noreferrer"
             class="inline-flex items-center gap-2 font-semibold text-brand-800 hover:underline">
            <img src="icons/nicfab-logo.png" alt="nicfab" width="61" height="28"
                 class="h-7 w-auto" />
            <span><span x-text="footerAuthor">Realizzato da</span> Nicola Fabiano</span>
          </a>
        </div>
        <div class="flex flex-wrap items-center justify-center gap-x-3 gap-y-1">
          <a x-bind:href="L.footerGuidaUrl" target="_blank" rel="noopener noreferrer"
             x-bind:aria-label="L.footerGuidaLabel"
             class="inline-flex items-center gap-1.5 text-brand-700 hover:text-brand-900 hover:underline">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4" aria-hidden="true">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </svg>
            <span x-text="L.footerGuidaLabel">Guida</span>
          </a>
          <span class="text-brand-300" aria-hidden="true">&middot;</span>
          <a href="https://codeberg.org/nicfab/ropa30" target="_blank" rel="noopener noreferrer"
             x-bind:aria-label="L.footerRepoAria"
             class="inline-flex items-center gap-1.5 text-brand-700 hover:text-brand-900 hover:underline">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4" aria-hidden="true">
              <polyline points="16 18 22 12 16 6"></polyline>
              <polyline points="8 6 2 12 8 18"></polyline>
            </svg>
            <span x-text="L.footerRepoLabel">Codice e segnalazioni</span>
          </a>
          <span class="text-brand-300" aria-hidden="true">&middot;</span>
          <button type="button" x-on:click="mailSupport"
                  x-bind:aria-label="L.footerEmailAria"
                  class="inline-flex items-center gap-1.5 text-brand-700 hover:text-brand-900 hover:underline">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4" aria-hidden="true">
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              <polyline points="22 6 12 13 2 6"></polyline>
            </svg>
            <span x-text="L.footerEmailLabel">Email</span>
          </button>
        </div>
        <div x-text="footerLicense">Rilasciato sotto AGPL-3.0-or-later</div>
      </div>
    </footer>

  </body>
</html>
